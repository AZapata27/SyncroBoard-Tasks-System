name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 6 * * 1' # weekly run, mainly for CodeQL (security job)

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, typecheck, test & build
    uses: AZapata27/reusable-workflows/.github/workflows/node.yml@1f72ba8c03929704ea446e9df6a80ceb23675d51 # v1.0.1
    permissions:
      contents: read
    with:
      node-version-file: .nvmrc
      fetch-depth: 0 # Nx needs history for affected/base comparisons
      run-command: npx nx run-many -t lint typecheck test build
      nx-no-cloud: true # self-contained runs: no Nx Cloud, no secrets
      timeout-minutes: 20

  workflow-lint:
    name: Workflow lint
    uses: AZapata27/reusable-workflows/.github/workflows/workflow-lint.yml@1f72ba8c03929704ea446e9df6a80ceb23675d51 # v1.0.1
    permissions:
      contents: read

  security:
    name: Security
    uses: AZapata27/reusable-workflows/.github/workflows/security.yml@1f72ba8c03929704ea446e9df6a80ceb23675d51 # v1.0.1
    permissions:
      contents: read
      actions: read # CodeQL (required by the called workflow's permission ceiling)
      security-events: write # CodeQL SARIF upload
    with:
      codeql-languages: '["javascript-typescript", "actions"]'
      # codeql-build-mode is not set: javascript-typescript and actions always use 'none'
